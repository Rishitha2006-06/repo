<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            margin: 20px;
        }

        h1 {
            color: darkgreen;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            background: white;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }

        img {
            width: 100%;
            border-radius: 8px;
        }

        p {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Nature Gallery</h1>

    <div class="gallery">

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg" alt="Mountain">
            <p>Beautiful Mountain</p>
        </div>

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Golde33443.jpg" alt="Sunflower">
            <p>Sunflower Field</p>
        </div>

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Gull_portrait_ca_usa.jpg" alt="Bird">
            <p>Sea Bird</p>
        </div>

    </div>

</body>
</html>
